/* ---------- button + link ---------- */
.q-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);height:var(--control);padding:0 var(--s-5);border:var(--bw) solid var(--border-strong);border-radius:var(--r-pill);background:transparent;color:var(--text);font-family:var(--font-sans);font-size:var(--ui-size);font-weight:var(--wt-regular);line-height:1;text-decoration:none;white-space:nowrap;cursor:pointer;transition:border-color var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease)}

.q-fav{display:flex;flex-wrap:wrap;gap:var(--s-9);align-items:flex-start}
.q-fav__hero{display:grid;place-items:center;width:320px;height:320px;border:var(--bw) solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
.q-fav__hero img{width:224px;height:224px}
.q-fav__tiles{display:flex;flex-wrap:wrap;gap:var(--s-5)}
.q-fav__tile{display:grid;place-items:center;width:var(--s-12);height:var(--s-12);border-radius:var(--r-md)}
.q-fav__tile--light{background:var(--preview-light)}
.q-fav__tile--dark{background:var(--preview-dark)}
.q-fav__tabbar{padding:var(--s-3) var(--s-3) 0;border-radius:var(--r-md) var(--r-md) 0 0}
.q-fav__tabbar--light{background:var(--preview-light)}
.q-fav__tabbar--dark{background:var(--preview-dark)}
.q-fav__tab{display:flex;align-items:center;gap:var(--s-3);width:250px;height:var(--control-sm);padding:0 var(--s-4);border-radius:var(--r-sm) var(--r-sm) 0 0;font:var(--wt-regular) var(--caption-size)/1 system-ui,-apple-system,sans-serif}
.q-fav__tab--light{background:var(--tab-light);color:var(--tab-light-text)}
.q-fav__tab--dark{background:var(--tab-dark);color:var(--text)}
.q-fav__tab span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (max-width:720px){
  .q-doc__row,.q-doc__pair{grid-template-columns:minmax(0,1fr)}
}
