# Server block for the nginxinc/nginx-unprivileged image, copied to
# /etc/nginx/conf.d/default.conf; the image's nginx.conf includes it inside `http`.
# Only cloudflared on the host reaches it, through 127.0.0.1:8080 (docker-compose.yml).
# HSTS and X-Content-Type-Options come from the Cloudflare zone, not from here.
# scripts/check-site.sh checks the behaviour below.

# The HEALTHCHECK calls from inside the container; tunnel traffic comes from the
# Docker network gateway. Health checks stay out of the access log.
map $remote_addr $loggable {
    127.0.0.1 0;
    default 1;
}

# $remote_addr is the Docker gateway; Cloudflare passes the visitor in CF-Connecting-IP.
log_format tunnel '$http_cf_connecting_ip [$time_local] "$request" $status '
                  '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /srv/site;

    access_log /var/log/nginx/access.log tunnel if=$loggable;
    server_tokens off;
    # nginx sees plain HTTP on 8080; a relative Location keeps the browser on
    # the public https:// host.
    absolute_redirect off;

    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # One URL per page (astro.config.mjs: trailingSlash "never", build.format "file").
    # $request_uri is the raw client request, so these run once and never on
    # internal redirects (error_page, try_files).
    # /index and /index.html -> /
    if ($request_uri ~ "^/index(\.html)?(?<q>\?.*)?$") {
        return 301 /$q;
    }
    # /x.html and /x/ -> /x, query kept. Exempt: the Search Console file (Google
    # checks its exact URL) and the 404 page. [^/\x5c] keeps //host and /\host
    # from turning into an off-site Location.
    if ($request_uri ~ "^(?!/google[0-9a-f]+\.html(?:\?|$)|/404\.html(?:\?|$))(?<p>/[^/\x5c].*?)(?:\.html|/)(?<q>\?.*)?$") {
        return 301 $p$q;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    location = /404 {
        return 404;
    }

    # Hashed file names: cache for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
